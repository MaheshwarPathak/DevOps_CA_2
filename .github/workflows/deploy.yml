name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate OPA deployment policy
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace openpolicyagent/opa eval -i /workspace/deployment.json -d /workspace/policy -f pretty 'data.policy.allow'

      - name: Set up Snyk
        uses: snyk/actions/setup@v3
        with:
          token: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk dependency scan
        run: snyk test --all-projects

      - name: Build Docker image
        run: docker build -t ci-cd-app:latest .

      - name: Run Snyk container scan
        run: snyk container test ci-cd-app:latest --file=Dockerfile
